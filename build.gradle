plugins {
    id 'com.android.application' version '8.9.3' apply false
    id 'com.android.library' version '8.9.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'com.google.firebase.crashlytics' version '3.0.6' apply false
}

/**
 * GLOBAL EXT CONFIG (USED BY app/build.gradle)
 */
ext {

    // ===== VERSIONING =====
    versionMajor = 3
    versionMinor = 05
    versionPatch = 06

    compileSdkVersion = 36
    minSdkVersion = 26
    targetSdkVersion = 36

    versionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
    versionName = "${versionMajor}.${versionMinor}.${versionPatch}"

    flavorDimensions = "default"

    // ===== LEGACY LIB VERSIONS (kept for safety) =====
    supportLibVersion = "28.0.0"
    appcompat = "1.1.0-alpha04"
    material = "1.1.0-alpha06"
    constraintLayout = "2.0.0-alpha5"
    playServicesVersion = "9.2.1"
    butterKnifeVersion = "10.2.3"
    volley = "1.1.1"
}
    ext.versions = [
            'support_library'         : '28.0.0',
            'constraint_layout'       : '1.1.3',
            'glide'                   : '4.9.0',
            'butterknife'             : '10.2.3',
            'gson'                    : '2.8.2',
            'volley'                  : '1.1.1',
            'lottie'                  : '3.0.1',
            'circleimageview'         : '2.2.0',
            'play_library'            : '18.1.0',
            'firebase_auth_library'   : '19.4.0',
            'firebase_message_library': '20.2.4',
            'firebase_crashlytics'    : '17.2.1',
            'firebase_analytics'      : '17.5.0',
            'safety_net'              : '17.0.0',
            'bitmovin'                : '2.53.0',
            'playServicesAdsVersion'  : '15.0.1',
            'imaSdkVersion'           : '3.11.3'


    ]



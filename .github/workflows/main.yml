name: Android Staging Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Java (IMPORTANT FIX)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Build Debug APK
      - name: Build Debug APK
        run: .\gradlew.bat assembleDebug

      # 🔍 Find APK (for debugging path)
      - name: Find APK files
        run: dir /s *.apk

      # Upload APK (NO PATH ISSUES)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: "**/*.apk"

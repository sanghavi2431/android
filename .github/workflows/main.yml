name: Android CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradlew
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Build AAB
        run: ./gradlew bundleRelease

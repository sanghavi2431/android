name: Android CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Fix gradlew issue
      - name: Fix gradlew issues
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          dos2unix gradlew
          chmod +x gradlew

      # Build AAB
      - name: Build AAB
        run: ./gradlew bundleRelease

      # Upload artifact (UPDATED VERSION)
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab

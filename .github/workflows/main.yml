name: Android Staging Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup Java
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Build APK
      - name: Build Debug APK
        run: .\gradlew.bat assembleDebug

      #  Copy APK to root (CLEAN OUTPUT)
      - name: Copy APK to root
        run: |
          $apk = Get-ChildItem -Recurse -Filter *.apk | Select-Object -First 1
          Copy-Item $apk.FullName -Destination app-debug.apk

      # Upload only single APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: app-debug.apk

name: Android CI

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥 Fix gradlew (Windows → Linux issue)
      - name: Fix gradlew issues
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          dos2unix gradlew
          chmod +x gradlew

      # 🔥 Build AAB (Play Store file)
      - name: Build AAB
        run: ./gradlew bundleRelease

      # ✅ Upload build file (so you can download)
      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab

name: Android Staging Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build APK
      - name: Build APK
        run: .\gradlew.bat assembleDebug

      # Find APK path
      - name: Find APK
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.apk

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: powderroom-apk
          path: |
            **/*.apk
